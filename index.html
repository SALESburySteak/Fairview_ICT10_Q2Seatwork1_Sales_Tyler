<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Seatwork 1</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container bg-light main-container p-5">
    <h1 class="text-center">Science Club Checker</h1>
    <br><br>
    <form>
        <div class="row">
            <div class="col">
                <label for="firstname" class="form-label"><b>First Name</b></label>
                <br>
                <input type="text" id="firstname" name="firstname" class="form-control" placeholder="ex. Juan" required>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col">
                <label for="lastname" class="form-label"><b>Last Name</b></label>
                <br>
                <input type="text" id="lastname" name="lastname" class="form-control" placeholder="ex. Dela Cruz" required>
            </div>
        </div>

        <br>
        <div class="row">
          <div class="col">
              <button class="btn w-100" type="button" py-click="check">Check</button>
            </div>
        </div>
        <br>
        <div class="row">
            <div id="output"></div>
        </div>
    </form>
    <br>
</div>
<br><br>
<script type ="py" src="main.py"></script>
</body>
</html>
