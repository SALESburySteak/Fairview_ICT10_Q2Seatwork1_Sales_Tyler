<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Seatwork 1</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

     <style>
        body {
            background: linear-gradient(135deg, #d2fdd7);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .main-container {
            max-width: 900px;
            margin: auto;
            border-radius: 40px;
            border: 10px solid #69ff7b;
        }

        .btn{
            background-color: #69ff7b;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            color: #d9ffde;
        }

        .btn:hover {
            background-color: #69ff7b;
        }

        #output {
            background-color: #c5f1ca;
            border: 2px solid #9cfda7;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #69ff7b;
        }
    </style>

</head>
<body>
    <br><br><br>
    <div class="container bg-light main-container p-5">
    <h1 class="text-center"> 🧪 Science Club Checker 🔬</h1>
    <br><br>
    <form>
        <div class="row">
            <div class="col">
                <label for="firstname" class="form-label"><b>First Name</b></label>
                <br>
                <input type="text" id="firstname" name="firstname" class="form-control" placeholder="ex. Juan" required>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col">
                <label for="lastname" class="form-label"><b>Last Name</b></label>
                <br>
                <input type="text" id="lastname" name="lastname" class="form-control" placeholder="ex. Dela Cruz" required>
            </div>
        </div>

        <br>
        <div class="row">
          <div class="col">
              <button class="btn w-100" type="button" py-click="check">Check</button>
            </div>
        </div>
        <br>
        <div class="row">
            <div id="output">You will see your member status here.</div>
        </div>
    </form>
    <br>
</div>
<br><br>
<script type ="py" src="main.py"></script>
</body>
</html>
